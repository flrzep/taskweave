name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.17.1   # pinned: a new ruff release must not turn main red by itself
          args: check .

  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    env:
      # a domain of its own, and no traffic beyond this machine: the ROS tests start nodes, action servers and
      # discover each other
      ROS_DOMAIN_ID: '91'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      # the agnostic-code check fails on any finding (the baseline is zero); unset it only warns
      TASKWEAVE_STRICT_AGNOSTIC: zero
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/taskweave
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          # the ros-base image has rosdep but not colcon
          apt-get install -y python3-colcon-common-extensions
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_direct+
      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          # one package at a time: the ROS tests of several packages must not share a domain concurrently
          colcon test --executor sequential --event-handlers console_direct+
          colcon test-result --verbose

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -t taskweave .
      - name: The cell example validates in the image
        run: docker run --rm -v "$PWD/docs/examples/cell:/cell:ro" taskweave taskweave check /cell

