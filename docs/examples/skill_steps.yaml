# Example steps of docs/skills.md (one or more per skill, in the order the reference lists the skills). Written against
# the example cell docs/examples/cell; taskweave_skills/test/test_docs_examples.py validates every step. After a change
# run: python3 tools/gen_skills_doc.py
move:
  - instruction: Drive to the pick position at the part stack
    skill: move
    args: {to: part_stack_1/pick}
  - instruction: Drive to a target of the cell
    skill: move
    args: {to: staging}
  - instruction: Move up to the work position straight ahead
    skill: move
    args: {to: fixture_1/work, motion: {mode: straight}}
  - instruction: Back out 40 cm
    skill: move
    args: {base: {by: [-0.4, 0]}}
  - instruction: Both hands 10 cm above the grasp point of the part
    skill: move
    args: {to: part_stack_1/grasp, offset_m: 0.1}
  - instruction: Left hand only, straight onto the point, at half speed
    skill: move
    args: {to: part_stack_1/grasp, hands: [left], motion: {mode: linear, speed: 0.5}}
  - instruction: Both hands to the presentation pose
    skill: move
    args: {to: present_both}
  - instruction: Hands 5 cm up from where they are
    skill: move
    args: {hand: all, by: [0, 0, 0.05]}
  - instruction: Lift the held part 20 cm
    skill: move
    args: {object: held, by: [0, 0, 0.2], torso: keep}
  - instruction: Into the carry pose
    skill: move
    args: {to: carry, torso: keep}
  - instruction: Part onto the seat of the bin, 5 cm short of it
    skill: move
    args: {to: bin_1/seat, offset_m: 0.05, torso: keep}
  - instruction: Swing the elbows out, the part staying where it is
    skill: move
    args: {elbow: out}
  - instruction: Arms in the driving pose
    skill: move
    args: {to: home_pose}
  - instruction: Only the left arm to the pose, half speed
    skill: move
    args: {to: home_pose, only: [left_arm], motion: {speed: 0.5}}
  - instruction: The lift to a given height
    skill: move
    args: {joints: {torso: 0.2}}
grip:
  - instruction: Close both grippers on the part
    skill: grip
    args: {hands: all, action: close}
  - instruction: Open the left gripper 40 mm wide
    skill: grip
    args: {hands: [left], action: opening, opening_mm: 40}
  - instruction: Let go and record where the part now is
    skill: grip
    args: {hands: all, action: open, place_as: part_stack_2}
wait:
  - instruction: Wait 3 seconds
    skill: wait
    args: {seconds: 3}
