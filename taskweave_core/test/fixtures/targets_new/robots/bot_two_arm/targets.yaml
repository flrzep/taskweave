# base-frame and joint targets (a robot pack ships them; here they sit in the cell pack)
home:                           # joint angles, not tool targets
  moves: joints
  joints:
    head: [0.0, 0.0]
    left_arm: [0.745, -1.865, -0.451, -1.752, -0.001, -0.473, -0.156]
    right_arm: [0.745, -1.865, -0.451, -1.752, -0.001, -0.473, -0.156]
lift_high: {moves: joints, joints: {torso: 0.6}}
lift_low: {moves: joints, joints: {torso: 0.1}}
lift_carry: {moves: joints, joints: {torso: 0.5}}   # home's lift height without moving the arms
frame_grasp_approach:
  moves: hand
  left_tool: {xyz: [0.48, -0.295, 0.6], rpy: [0.0, -1.5708, -3.1416]}   # was tcp [0.48, -0.295, 0.6] approach [1,0,0] closing [0,-1,0]
  right_tool: {xyz: [0.48, 0.295, 0.6], rpy: [0.0, 1.5708, 0.0]}        # was closing [0,1,0]
  elbow: up
  joints: {torso: 0.5, head: [-0.3491, 0.0]}
carry:                          # for driving: lift 0.5, frame 0.85 m ahead, flat
  moves: object
  type: frame_type2
  path:
  - {xyz: [1.0, 0.0, 0.4], rpy: [0.0, -0.8727, 0.0]}
stand_up:                       # from carry: out and up, then hook end on top (90 deg)
  moves: object
  type: frame_type2
  joints: {torso: 0.55}
  path:
  - {xyz: [1.3, 0.0, 0.5], rpy: [0.0, -0.8727, 0.0]}
  - {xyz: [1.1, 0.0, 0.7], rpy: [0.0, -1.5708, 0.0]}
set_down_held:                  # was held pose `set_down`; renamed, `set_down` is the cell location
  moves: object
  type: frame_type2
  path:
  - {xyz: [0.9, 0.0, -0.2], rpy: [0.0, 0.0, 0.0]}      # level it first
  - {xyz: [0.85, 0.0, -0.563], rpy: [0.0, 0.0, 0.0]}
hang-approach:                  # at the hang stance, before the hook
  moves: object
  type: frame_type2
  path:
  - {xyz: [1.1, 0.0, 0.7], rpy: [0.0, -1.5708, 0.0]}
