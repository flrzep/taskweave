# Named poses of the Galbot S1 with Galbot G1 grippers. A pose sets joints directly (torso lift body_joint in m, head
# in rad) and places each tool: the canonical TCP (grasp centre, between the fingers) in base_link coordinates (x
# forward, y left, z up; base_link = column base, 0.583 m above the floor), with its approach (TCP z) and closing (TCP
# y) directions. The arm joints are solved by IK (MoveIt) when the pose is used. Partial poses list joints only (d-pad
# lift buttons). home is the only full pose (it is also the driving pose). Poses for one cell's objects belong to the
# cell pack (robots/galbot_s1_g1gripper/poses.yaml there).
# From galbot_s1 (same arms), inside the vendor joint limits of moveit/robot.urdf (19 Oct).
home:                           # galbot_s1's home: the same link7 poses (within 0.01 mm). The right arm cannot take the
                                # left's values (vendor limit right_joint2 >= -1.745, left -1.865): solved inside the
                                # limits on the URDF chain, joint 4 unchanged. Collision-free with the G1 grippers
                                # open and closed (move_group /check_state_validity, 19 Oct).
  body_joint: 0.494
  head_joint1: 0.0
  head_joint2: 0.0
  left_joint1: 0.745
  left_joint2: -1.865
  left_joint3: -0.451
  left_joint4: -1.752
  left_joint5: -0.001
  left_joint6: -0.473
  left_joint7: -0.156
  right_joint1: 0.725
  right_joint2: -1.7253
  right_joint3: -0.3178
  right_joint4: -1.752
  right_joint5: -0.1957
  right_joint6: -0.4572
  right_joint7: -0.3347
lift_high: {body_joint: 0.6}
lift_low: {body_joint: 0.1}
lift_carry: {body_joint: 0.5}   # home's lift height without moving the arms (allowed while holding)
