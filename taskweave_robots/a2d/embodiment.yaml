# What the Agibot A2D is and can do. No topics or joint names (see profile.yaml).
# "~" = not measured yet (never guessed). Reach, stroke and finger length were measured in the sim from link
# frames (tools ros/measure_a2d.py, 8 Oct), about +-1 cm; payload needs the datasheet.
name: a2d
summary: >-
  Wheeled bimanual humanoid: holonomic base, lift torso, two 7-DoF arms with parallel grippers,
  RGB-D head camera and one RGB-D camera per wrist.
capabilities: [base.holonomic, torso.lift, torso.pitch, head.pan_tilt, arms.bimanual, gripper.parallel,
               camera.head.rgbd, camera.wrist.rgbd]
base:  {footprint: [0.60, 0.45], max_speed: {linear: 1.0, angular: 1.5}}
torso: {lift_range_m: [0.0, 0.5], pitch_range_rad: [0.0, 1.57]}   # joint limits of the 6.1 asset
arms:
  left:  {dof: 7, reach_m: 0.84, payload_kg: ~, tool: left}     # shoulder to TCP, straight arm
  right: {dof: 7, reach_m: 0.84, payload_kg: ~, tool: right}
tools:
  left:  {type: parallel_gripper, stroke_m: 0.10, finger_length_m: 0.06}   # fingertip gap 0.046-0.149 m
  right: {type: parallel_gripper, stroke_m: 0.10, finger_length_m: 0.06}
cameras:
  head:        {type: rgbd, hfov_deg: 69, range_m: [0.1, 10.0]}
  left_wrist:  {type: rgbd, hfov_deg: 87, range_m: [0.07, 1.0], mounted_on: tools.left}
  right_wrist: {type: rgbd, hfov_deg: 87, range_m: [0.07, 1.0], mounted_on: tools.right}
action_spaces:
  joint_pos_bimanual: {dims: 17, rate_hz: 30, description: "2x7 arm joints, 2 grippers, lift"}
