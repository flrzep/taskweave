# Joint speed and acceleration limits for MoveIt's trajectory timing (robot_description_planning). Speeds are the
# ones the direct joint moves use (taskweave joint skills: 1.2 rad/s, lift 0.25 m/s; 15 Oct, was 0.6 and 0.1); the URDF
# limits (2.0 rad/s, 0.5 m/s) are the ceiling.
