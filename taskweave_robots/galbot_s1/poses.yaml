# Named poses of the Galbot S1. A pose sets joints directly (torso lift body_joint in m, head in rad) and places each
# tool: the canonical TCP (grasp centre, between the fingers) in base_link coordinates (x forward, y left, z up;
# base_link = column base, 0.583 m above the floor), with its approach (TCP z) and closing (TCP y) directions. The
# arm joints are solved by IK (MoveIt) when the pose is used. Partial poses list joints only (d-pad lift buttons).
# home is the only full pose (13 Oct: ready and tucked folded into it; it is also the driving pose). Poses for one
# cell's objects belong to the cell pack (robots/galbot_s1/poses.yaml there).
# Converted 9 Oct from the joint-space poses (incl. the HMI edits of home and tucked) by forward kinematics.
home:                           # 15 Oct: joint angles, not tool targets: IK chose elbows up and out (0.66 m, 0.52 m
                                # to the side) and broke the cycle. Same TCPs as before ([0.8767, +-0.1993, 0.2924],
                                # approach +x, closing -z; within 0.5 mm), the elbow-lowest solution: elbows 0.47 m
                                # below the shoulders, wrists nearly straight. Arms mirror: same values both sides.
                                # 20 Oct (F13): no torso: the torso search picks it per move, and navigate_to /
                                # drive_straight bring it to profile torso.drive_m (0.494) before driving.
  head_joint1: 0.0
  head_joint2: 0.0
  left_joint1: 0.745
  left_joint2: -1.865
  left_joint3: -0.451
  left_joint4: -1.752
  left_joint5: -0.001
  left_joint6: -0.473
  left_joint7: -0.156
  right_joint1: 0.745
  right_joint2: -1.865
  right_joint3: -0.451
  right_joint4: -1.752
  right_joint5: -0.001
  right_joint6: -0.473
  right_joint7: -0.156
lift_high: {body_joint: 0.6}
lift_low: {body_joint: 0.1}
lift_carry: {body_joint: 0.5}   # home's lift height without moving the arms (allowed while holding)
